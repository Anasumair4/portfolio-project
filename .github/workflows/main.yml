name: Test and Deploy Website to S3

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # ==========================================
  # JOB 1 - TEST WEBSITE
  # ==========================================

  test:
    name: Test Website
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          echo "Checking required website files..."

          test -f index.html || {
            echo "ERROR: index.html is missing"
            exit 1
          }

          test -f style.css || {
            echo "ERROR: style.css is missing"
            exit 1
          }

          test -f script.js || {
            echo "ERROR: script.js is missing"
            exit 1
          }

          echo "All required files found."

      - name: Check HTML
        run: |
          echo "Checking HTML..."

          grep -q "<!DOCTYPE html>" index.html || {
            echo "ERROR: Missing DOCTYPE"
            exit 1
          }

          grep -q "<html" index.html || {
            echo "ERROR: Missing html tag"
            exit 1
          }

          grep -q "</html>" index.html || {
            echo "ERROR: Missing closing html tag"
            exit 1
          }

          echo "HTML basic validation passed."

      - name: Check CSS
        run: |
          echo "Checking CSS..."

          test -s style.css || {
            echo "ERROR: style.css is empty"
            exit 1
          }

          echo "CSS validation passed."

      - name: Check JavaScript
        run: |
          echo "Checking JavaScript..."

          test -s script.js || {
            echo "ERROR: script.js is empty"
            exit 1
          }

          node --check script.js

          echo "JavaScript validation passed."

      - name: Check for broken required references
        run: |
          echo "Checking website references..."

          grep -q 'href="style.css"' index.html || {
            echo "ERROR: style.css is not linked"
            exit 1
          }

          grep -q 'src="script.js"' index.html || {
            echo "ERROR: script.js is not linked"
            exit 1
          }

          echo "References look good."

      - name: Test completed
        run: |
          echo "================================"
          echo "All tests passed successfully!"
          echo "================================"


  # ==========================================
  # JOB 2 - DEPLOY TO AWS S3
  # ==========================================

  deploy:
    name: Deploy to AWS S3
    runs-on: ubuntu-latest

    needs: test

    # Only deploy when code is pushed to main.
    # Pull requests will run the tests but won't deploy.

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4

        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}


      - name: Check AWS connection
        run: |
          echo "Testing AWS credentials..."

          aws sts get-caller-identity

          echo "AWS authentication successful."


      - name: Check S3 bucket
        run: |
          echo "Checking S3 bucket..."

          aws s3api head-bucket \
            --bucket "${{ secrets.S3_BUCKET_NAME }}"

          echo "S3 bucket is accessible."


      - name: Sync website to S3
        run: |
          echo "Deploying website..."

          aws s3 sync . \
            "s3://${{ secrets.S3_BUCKET_NAME }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude "README.md"

          echo "Website successfully synced to S3."


      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment successful!"
          echo "======================================"
          echo "S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}"
